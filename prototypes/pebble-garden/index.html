<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pebble Garden Prototype</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app-shell" aria-label="Pebble Garden mechanics prototype">
      <section class="game-surface">
        <header class="top-bar">
          <div>
            <p id="level-name" class="eyebrow">Level 1 - First Bloom</p>
            <h1>Pebble Garden</h1>
          </div>
          <div class="top-actions">
            <div class="score-panel" aria-live="polite">
              <span>Score</span>
              <strong id="score">0</strong>
            </div>
            <button id="menu-button" class="icon-button" type="button" aria-label="Pause and settings" title="Pause and settings">
              <span class="more-icon" aria-hidden="true"></span>
            </button>
          </div>
        </header>

        <section class="status-row" aria-live="polite">
          <p id="message">Bloom two marked beds before eight moves run out.</p>
          <nav class="level-switcher" aria-label="Level selection">
            <button id="previous-level" class="level-button" type="button" aria-label="Previous level" title="Previous level">
              <span class="chevron chevron-left" aria-hidden="true"></span>
            </button>
            <strong id="level-progress">1 / 5</strong>
            <button id="next-level" class="level-button" type="button" aria-label="Next level" title="Next level">
              <span class="chevron chevron-right" aria-hidden="true"></span>
            </button>
          </nav>
        </section>

        <section class="goal-panel" aria-label="Garden goal">
          <div class="goal-copy">
            <span>Garden Goal</span>
            <strong id="goal-label">Bloom 2 beds</strong>
            <em id="flow-label">Flow x1</em>
            <em id="move-label">8 moves</em>
          </div>
          <div class="goal-meter" aria-hidden="true">
            <span id="goal-fill"></span>
          </div>
        </section>

        <section class="board-wrap">
          <div id="board" class="board" aria-label="Pebble Garden board"></div>
        </section>

        <section class="tray-area" aria-label="Pebble tray">
          <div class="tray-header">
            <span>Pebble Tray</span>
            <span id="garden-label">Beds 0/2</span>
          </div>
          <div id="tray" class="tray"></div>
        </section>

        <footer class="controls-note">
          <span>Select pebble</span>
          <span>Aim at beds</span>
          <span>Bloom beds</span>
        </footer>

        <div id="result-backdrop" class="result-backdrop" hidden>
          <section class="result-panel" role="dialog" aria-modal="true" aria-labelledby="result-title">
            <p id="result-kicker" class="result-kicker">Round Complete</p>
            <h2 id="result-title">Garden Saved</h2>
            <div id="result-rating" class="result-rating" aria-label="One out of three garden marks">
              <span class="result-mark"></span>
              <span class="result-mark"></span>
              <span class="result-mark"></span>
            </div>
            <p id="result-copy" class="result-copy"></p>
            <dl class="result-stats">
              <div>
                <dt>Moves</dt>
                <dd id="result-moves">0</dd>
              </div>
              <div>
                <dt>Bed Clears</dt>
                <dd id="result-growth">0</dd>
              </div>
              <div>
                <dt>Best Flow</dt>
                <dd id="result-flow">x1</dd>
              </div>
            </dl>
            <p id="result-best" class="result-best"></p>
            <button id="play-again" class="primary-button" type="button">Play Again</button>
          </section>
        </div>

        <div id="settings-backdrop" class="settings-backdrop" hidden>
          <section class="settings-panel" role="dialog" aria-modal="true" aria-labelledby="settings-title">
            <p class="result-kicker">Paused</p>
            <h2 id="settings-title">Garden Break</h2>
            <div class="setting-list">
              <label class="setting-row" for="sound-toggle">
                <span>
                  <strong>Sound</strong>
                  <small>Soft game cues</small>
                </span>
                <input id="sound-toggle" type="checkbox" checked>
                <span class="switch" aria-hidden="true"></span>
              </label>
              <label class="setting-row" for="haptics-toggle">
                <span>
                  <strong>Haptics</strong>
                  <small>Gentle tap feedback</small>
                </span>
                <input id="haptics-toggle" type="checkbox" checked>
                <span class="switch" aria-hidden="true"></span>
              </label>
            </div>
            <button id="resume-game" class="primary-button" type="button">Resume</button>
            <button id="restart-game" class="secondary-button" type="button">Restart Round</button>
          </section>
        </div>
      </section>
    </main>

    <script src="game.js"></script>
  </body>
</html>
